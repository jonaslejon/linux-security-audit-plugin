name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Lint the tracer and the test suite
        run: |
          shellcheck -S warning \
            plugins/linux-security-audit/skills/linux-security-audit/scripts/lsa-trace.sh \
            tests/*.sh
      # The collector is large enough that shellcheck needs a raised stack to analyse it, and it
      # OOMs at the default limit. Informational rather than blocking so a shellcheck resource
      # limit cannot gate a security fix, but the output is still surfaced in the log.
      - name: Lint the collector (informational)
        continue-on-error: true
        run: |
          ulimit -s unlimited || true
          shellcheck -S error \
            plugins/linux-security-audit/skills/linux-security-audit/scripts/lsa-collect.sh

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every shell script
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "syntax error: $f"; exit 1; }
          done
      - name: Validate the plugin manifests
        run: |
          python3 -c "import json,sys; [json.load(open(p)) for p in sys.argv[1:]]" \
            .claude-plugin/marketplace.json \
            plugins/linux-security-audit/.claude-plugin/plugin.json

  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline (--root) contract
        run: bash tests/offline-regression.sh

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Counts, versions and changelog agree
        run: bash tests/metadata-consistency.sh

  # A check that emits nothing reads as a pass, which is the one failure mode the output format
  # cannot express. This pins the ID universe so a check cannot vanish quietly.
  check-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned image, because the ID universe depends on the auditing environment: which checks
      # fire at all varies with installed tooling and with whether the auditor is itself a
      # container. The baseline is generated in this same image, so the comparison is meaningful.
      - name: No check may stop emitting
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo debian:stable-slim \
            bash tests/check-registry.sh

  # The collector's whole purpose is to run on a booted Linux host, so CI runs it on one. This is
  # the coverage that fixture tests cannot give: real /proc, real systemd, a real package database.
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run against the runner itself
        run: |
          S=plugins/linux-security-audit/skills/linux-security-audit/scripts/lsa-collect.sh
          sudo bash "$S" --quick --passive > live.txt 2>live.err
          echo "exit=$?"
          tail -20 live.txt
      - name: A run must produce checks and a summary
        run: |
          n=$(grep -c '^CHECK|' live.txt)
          echo "checks emitted: $n"
          [ "$n" -gt 200 ] || { echo "too few checks: $n"; exit 1; }
          grep -q '^checks_total=' live.txt || { echo "no RUN_SUMMARY"; exit 1; }
          grep -q '^===== END OF COLLECTION =====' live.txt || { echo "did not reach the end"; exit 1; }
      - name: Records must be well formed
        run: |
          bad=$(grep '^CHECK|' live.txt | awk -F'|' 'NF != 6' | head -5)
          [ -z "$bad" ] || { echo "malformed records:"; echo "$bad"; exit 1; }
      - name: No check may report an empty verdict
        run: |
          bad=$(grep '^CHECK|' live.txt | awk -F'|' '$3 !~ /^(PASS|FAIL|WARN|INFO|NA)$/' | head -5)
          [ -z "$bad" ] || { echo "bad verdicts:"; echo "$bad"; exit 1; }
      - name: No duplicate check IDs on a real host
        run: |
          dupes=$(grep '^CHECK|' live.txt | cut -d'|' -f2 | sort | uniq -d | head -5)
          [ -z "$dupes" ] || { echo "duplicate ids:"; echo "$dupes"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-collection
          path: |
            live.txt
            live.err

  # The collector's container handling only exists to be run in a container, so run it in one.
  container-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit a stock image and assert host controls are not reported as image defects
        run: |
          S=plugins/linux-security-audit/skills/linux-security-audit/scripts/lsa-collect.sh
          docker run --rm -i --entrypoint bash --network none debian:stable-slim -s -- --passive < "$S" > ctr.txt 2>/dev/null || true
          grep -q '^CHECK|container.context' ctr.txt || { echo "container not detected"; exit 1; }
          echo "--- non-PASS lines ---"; grep '^CHECK|' ctr.txt | grep -vE '\|(PASS|NA|INFO)\|' || true
          # host-owned controls must be NA in a container, never a finding against the image
          for id in firewall.active integrity.fim time.synced session.tmout cron.allow; do
            v=$(grep "^CHECK|$id|" ctr.txt | cut -d'|' -f3)
            [ -z "$v" ] && continue
            [ "$v" = "NA" ] || { echo "$id reported '$v' in a container; must be NA"; exit 1; }
          done
          n=$(grep '^CHECK|' ctr.txt | grep -cvE '\|(PASS|NA|INFO)\|')
          echo "non-PASS findings on a stock debian image: $n"
          [ "$n" -lt 20 ] || { echo "container profile is not suppressing host controls"; exit 1; }
      # Stock Ubuntu ships /home/<user> at 0750 with a per-user private group and
      # USERGROUPS_ENAB yes, so it is private in practice. Warning about the vendor default of
      # the most widely deployed distribution, for an exposure that does not exist, is noise.
      - name: A per-user private group is not an exposure
        run: |
          S=plugins/linux-security-audit/skills/linux-security-audit/scripts/lsa-collect.sh
          docker run --rm -i --entrypoint bash --network none ubuntu:latest -s -- --passive < "$S" > ubu.txt 2>/dev/null || true
          grep -E '^CHECK\|perm\.home' ubu.txt || true
          for id in perm.home_dirs perm.home_default; do
            v=$(grep "^CHECK|$id|" ubu.txt | cut -d'|' -f3)
            [ "$v" = "PASS" ] || { echo "$id was '$v' on stock ubuntu; a private group is not an exposure"; exit 1; }
          done
      # ...but a genuinely shared group still has to be caught, or the check above is just blind.
      - name: A shared group is still a finding
        run: |
          S=plugins/linux-security-audit/skills/linux-security-audit/scripts/lsa-collect.sh
          cat > ctl.sh <<'EOS'
          useradd -m -u 1100 alice >/dev/null 2>&1 || true
          groupadd shared >/dev/null 2>&1 || true
          usermod -aG shared alice >/dev/null 2>&1 || true
          useradd -m -u 1101 bob >/dev/null 2>&1 || true
          usermod -aG shared bob >/dev/null 2>&1 || true
          chgrp shared /home/alice && chmod 750 /home/alice
          bash /tmp/lsa.sh --passive 2>/dev/null | grep '^CHECK|perm.home_dirs|'
          EOS
          out=$(docker run --rm -v "$PWD/$S:/tmp/lsa.sh:ro" -v "$PWD/ctl.sh:/tmp/ctl.sh:ro" \
                  --entrypoint bash --network none ubuntu:latest /tmp/ctl.sh)
          echo "$out"
          echo "$out" | grep -q '|WARN|' || { echo "a shared-group home was not reported"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-collection
          path: ctr.txt
